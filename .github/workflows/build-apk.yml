name: Build Chutki Rider APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show SHA-1 and SHA-256
        run: |
          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E "SHA1:|SHA256:"

      - name: Create .env for Secrets Gradle Plugin
        run: |
          cat <<EOF > .env
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'OPTIONAL_GEMINI_API_KEY' }}
          FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID || 'OPTIONAL_FIREBASE_ANDROID_APP_ID' }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || 'OPTIONAL_GOOGLE_WEB_CLIENT_ID' }}
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug.keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-file
          path: debug.keystore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chutki-Rider-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
